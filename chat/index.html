<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Чат</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --border: #dfe3ea;
  --accent: #2f6fed; --accent-text: #ffffff; --user: #e8f0fe; --code: #f0f2f5; --error: #c62828;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161b; --panel: #1c1f26; --text: #e4e7ee; --muted: #8b93a5; --border: #2c313c;
    --accent: #5b8def; --accent-text: #0d1117; --user: #22304a; --code: #262a33; --error: #ef6b6b;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--border); }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
input, select, textarea, button { font: inherit; color: inherit; }
input, select, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
#token { width: 220px; } #model { min-width: 160px; max-width: 260px; }
button { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
.spacer { flex: 1; }
#status { color: var(--muted); font-size: 13px; }
#status.err { color: var(--error); }
details { padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
details summary { cursor: pointer; color: var(--muted); padding: 6px 0; font-size: 13px; }
#system { width: 100%; min-height: 60px; margin-bottom: 10px; resize: vertical; }
main { flex: 1; overflow-y: auto; padding: 16px; }
.log { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.msg { padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border);
  overflow-wrap: anywhere; }
.msg.user { background: var(--user); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
.msg.error { color: var(--error); }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
.msg pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; }
.msg code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13.5px; }
.msg pre code { padding: 0; background: none; }
.msg ul, .msg ol { margin: 0 0 8px; padding-left: 22px; }
.meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
.empty { color: var(--muted); text-align: center; margin-top: 15vh; }
footer { padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--border); }
form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
#input { flex: 1; resize: none; min-height: 44px; max-height: 200px; }
.tool { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); font-size: 13.5px; }
.tool summary { cursor: pointer; padding: 6px 10px; display: flex; gap: 8px; align-items: baseline; overflow: hidden; }
.tool summary code { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tool .st { width: 1em; flex: none; } .tool .st.ok { color: #2e7d32; } .tool .st.bad { color: var(--error); }
.tool pre { margin: 0 10px 8px; background: var(--code); padding: 8px; border-radius: 6px; overflow-x: auto;
  white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow-y: auto; }
.perm { margin: 0 10px 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.perm span { flex: 1 1 100%; color: var(--muted); }
#session { min-width: 160px; max-width: 280px; }
@media (max-width: 600px) { #token, #model, #session { width: 100%; max-width: none; } }
</style>
</head>
<body>
<header>
  <h1>LLM Чат</h1>
  <select id="mode" title="Режим"><option value="chat">Чат</option><option value="agent">Агент</option></select>
  <input id="token" type="password" placeholder="Токен gw-…" autocomplete="off">
  <label><input id="remember" type="checkbox"> Запомнить токен</label>
  <select id="model"><option value="">— модель —</option></select>
  <select id="session" hidden title="Сессия агента"></select>
  <button id="reload" title="Обновить список моделей">↻</button>
  <span id="status"></span>
  <span class="spacer"></span>
  <button id="new">Новый чат</button>
</header>
<details id="params">
  <summary>Системный промпт и параметры</summary>
  <textarea id="system" placeholder="Например: Отвечай кратко и по-русски."></textarea>
  <label>Температура <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7" style="width:80px"></label>
</details>
<main><div class="log" id="log"><div class="empty">Введите токен, выберите модель и задайте вопрос.</div></div></main>
<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Сообщение… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
    <button class="primary" id="send" type="submit">Отправить</button>
    <button id="stop" type="button" hidden>Стоп</button>
  </form>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let history = [];
let controller = null;
let mode = store.get("gw_mode") === "agent" ? "agent" : "chat";
let agentSession = store.get("gw_agent_session") || null;
let cards = {};

$("remember").checked = store.get('gw_remember') === 'yes';
$("token").value = $("remember").checked ? store.get("gw_token") : '';
if (!$("remember").checked) { try { localStorage.removeItem('gw_token'); } catch {} }
$("system").value = store.get("gw_system");

function setStatus(text, err = false) { $("status").textContent = text; $("status").className = err ? "err" : ""; }
function headers() { return { "Content-Type": "application/json", "Authorization": "Bearer " + $("token").value.trim() }; }

async function apiError(resp) {
  try { const j = await resp.json(); return j.error?.message || j.detail || resp.statusText; }
  catch { return resp.status + " " + resp.statusText; }
}

async function loadModels() {
  if (!$("token").value.trim()) { setStatus("нужен токен", true); return; }
  setStatus("загрузка моделей…");
  try {
    const resp = await fetch("/v1/models", { headers: headers() });
    if (!resp.ok) { setStatus(await apiError(resp), true); return; }
    const data = (await resp.json()).data || [];
    const saved = store.get("gw_model");
    $("model").innerHTML = data.map(m => `<option>${escapeHtml(m.id)}</option>`).join("") || '<option value="">нет моделей</option>';
    if (data.some(m => m.id === saved)) $("model").value = saved;
    setStatus(`моделей: ${data.length}`);
  } catch (e) { setStatus("шлюз недоступен", true); }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Небольшой markdown: блоки кода, инлайн-код, жирный/курсив, списки, заголовки, абзацы.
function renderMarkdown(src) {
  const parts = src.split(/```/);
  return parts.map((part, i) => {
    if (i % 2) {
      const body = part.replace(/^[^\n]*\n/, "");
      return `<pre><code>${escapeHtml(body)}</code></pre>`;
    }
    return part.split(/\n{2,}/).map(block => {
      let html = escapeHtml(block.trim());
      if (!html) return "";
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>")
                 .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
                 .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      const lines = html.split("\n");
      if (lines.every(l => /^\s*[-*•] /.test(l))) return "<ul>" + lines.map(l => `<li>${l.replace(/^\s*[-*•] /, "")}</li>`).join("") + "</ul>";
      if (lines.every(l => /^\s*\d+[.)] /.test(l))) return "<ol>" + lines.map(l => `<li>${l.replace(/^\s*\d+[.)] /, "")}</li>`).join("") + "</ol>";
      if (/^#{1,6} /.test(html)) return `<p><strong>${html.replace(/^#{1,6} /, "")}</strong></p>`;
      return `<p>${lines.join("<br>")}</p>`;
    }).join("");
  }).join("");
}

function addMessage(role, text) {
  const empty = document.querySelector(".empty"); if (empty) empty.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  if (role === "assistant") el.innerHTML = renderMarkdown(text); else el.textContent = text;
  $("log").appendChild(el);
  el.scrollIntoView({ block: "end" });
  return el;
}

function busy(on) {
  $("send").hidden = on; $("stop").hidden = !on; $("input").disabled = on;
  for (const id of ['mode','model','session','token','new','reload','remember']) $(id).disabled = on;
}

async function* readSSE(resp) {
  const reader = resp.body.getReader(), decoder = new TextDecoder();
  let buf = '';
  function data(block) {
    const value = block.split(/\r?\n/).filter(l => l.startsWith('data:')).map(l => l.slice(5).trimStart()).join('\n');
    if (!value.trim()) return null;
    return value.trim() === '[DONE]' ? {stream_done: true} : JSON.parse(value);
  }
  try {
    for (;;) {
      const {value, done} = await reader.read();
      buf += done ? decoder.decode() : decoder.decode(value, {stream:true});
      if (buf.length > 1048576) throw new Error('Слишком большое SSE-событие');
      const blocks = buf.split(/\r?\n\r?\n/); buf = blocks.pop();
      for (const block of blocks) { const event = data(block); if (event) yield event; }
      if (done) { const event = data(buf); if (event) yield event; break; }
    }
  } finally { try { await reader.cancel(); } finally { reader.releaseLock(); } }
}

async function send(text) {
  const model = $("model").value;
  if (!$("token").value.trim()) { setStatus("нужен токен", true); return; }
  if (!model) { setStatus("выберите модель", true); return; }
  history.push({ role: "user", content: text });
  addMessage("user", text);
  const el = addMessage("assistant", "…");
  const messages = [];
  const system = $("system").value.trim();
  if (system) messages.push({ role: "system", content: system });
  messages.push(...history);

  controller = new AbortController();
  busy(true); setStatus("генерация…");
  let answer = "", usage = null, completed = false;
  const started = performance.now();
  try {
    const resp = await fetch("/v1/chat/completions", {
      method: "POST", headers: headers(), signal: controller.signal,
      body: JSON.stringify({ model, messages, stream: true, temperature: Number($("temperature").value) }),
    });
    if (!resp.ok) throw new Error(await apiError(resp));
    let finished = false;
    for await (const j of readSSE(resp)) {
      if (j.stream_done) { finished = true; break; }
      if (j.error) throw new Error(j.error.message || 'Ошибка модели');
      if (j.usage) usage = j.usage;
      const choice = j.choices?.[0], delta = choice?.delta?.content;
      if (choice?.finish_reason) {
        if (choice.finish_reason !== 'stop') throw new Error('Ответ не завершён: ' + choice.finish_reason);
        finished = true;
      }
      if (delta) { answer += delta; el.innerHTML = renderMarkdown(answer); el.scrollIntoView({block:'end'}); }
    }
    if (!finished) throw new Error('Поток оборвался до завершения ответа');
    completed = true;
    setStatus("");
  } catch (e) {
    if (e.name === "AbortError") setStatus("остановлено");
    else { el.classList.add("error"); answer = answer || ""; el.textContent = (answer ? answer + "\n\n" : "") + "Ошибка: " + e.message; setStatus("ошибка", true); }
  } finally {
    controller = null; busy(false); $("input").focus();
  }
  if (answer) {
    if (completed) history.push({ role: "assistant", content: answer });
    else history.pop();
    const meta = document.createElement("div");
    meta.className = "meta";
    const secs = ((performance.now() - started) / 1000).toFixed(1);
    meta.textContent = `${model} · ${secs} с` + (usage ? ` · токенов: ${usage.prompt_tokens} → ${usage.completion_tokens}` : "");
    el.appendChild(meta);
  } else {
    history.pop();
    if (!el.classList.contains("error")) el.remove();
  }
}

// ---------- режим агента (/agent/*, docs/wiki/web-chat.md) ----------

function clearLog(text) {
  $("log").innerHTML = text ? `<div class="empty">${escapeHtml(text)}</div>` : "";
  cards = {};
}

function safeJson(s) { try { return typeof s === "string" ? JSON.parse(s || "{}") : (s || {}); } catch { return s; } }
function shortArgs(a) { const t = typeof a === "string" ? a : JSON.stringify(a); return t.length > 120 ? t.slice(0, 119) + "…" : t; }

function toolCard(id, name, args) {
  const empty = document.querySelector(".empty"); if (empty) empty.remove();
  const el = document.createElement("details");
  el.className = "tool";
  el.innerHTML = `<summary><span class="st">…</span><b></b><code></code></summary><pre class="args"></pre><pre class="result" hidden></pre>`;
  el.querySelector("b").textContent = name;
  el.querySelector("code").textContent = shortArgs(args);
  el.querySelector(".args").textContent = typeof args === "string" ? args : JSON.stringify(args, null, 2);
  $("log").appendChild(el);
  el.scrollIntoView({ block: "end" });
  cards[id] = el;
  return el;
}

function setToolResult(el, ok, content, ms) {
  const st = el.querySelector(".st");
  st.textContent = ok ? "✓" : "✗"; st.className = "st " + (ok ? "ok" : "bad");
  const res = el.querySelector(".result");
  res.hidden = false; res.textContent = content + (ms != null ? `\n\n(${ms} мс)` : "");
  el.querySelector(".perm")?.remove();
}

function askPermission(ev) {
  const el = cards[ev.id] || toolCard(ev.id, ev.name, ev.arguments);
  el.open = true;
  el.querySelector(".st").textContent = "?";
  const box = document.createElement("div");
  box.className = "perm";
  box.innerHTML = `<span></span><button class="primary" data-d="allow">Разрешить</button><button data-d="deny">Запретить</button><button data-d="always">Всегда</button>`;
  const why = ev.reason && ev.reason !== "требует подтверждения" ? ` (${ev.reason})` : "";
  box.querySelector("span").textContent = `Нужно подтверждение${why}. «Всегда» добавит правило ${ev.rule}`;
  box.addEventListener("click", async (e) => {
    const decision = e.target.dataset?.d; if (!decision) return;
    box.querySelectorAll("button").forEach(b => b.disabled = true);
    try {
    const resp = await fetch(`/agent/sessions/${agentSession}/approve`, {
      method: "POST", headers: headers(), body: JSON.stringify({ id: ev.id, decision }) });
    if (!resp.ok) { setStatus(await apiError(resp), true); box.querySelectorAll("button").forEach(b => b.disabled = false); return; }
    box.remove(); el.querySelector(".st").textContent = "…";
    } catch (error) {
      setStatus('Подтверждение не отправлено; повторите', true);
      box.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  });
  el.appendChild(box);
  el.scrollIntoView({ block: "end" });
}

async function loadSessions() {
  try {
  if (!$("token").value.trim()) return;
  const resp = await fetch("/agent/sessions", { headers: headers() });
  if (!resp.ok) {
    setStatus(await apiError(resp), true);
    $("session").innerHTML = '<option value="">агент недоступен</option>';
    return;
  }
  const data = (await resp.json()).data || [];
  $("session").innerHTML = '<option value="">— новая сессия —</option>' +
    data.map(x => `<option value="${escapeHtml(x.id)}">${escapeHtml(x.title || x.id)}</option>`).join("");
  if (!data.some(x => x.id === agentSession)) agentSession = null;
  $("session").value = agentSession || "";
  } catch (error) { setStatus('Шлюз недоступен; повторите загрузку', true); }
}

async function openSession(id) {
  try {
  agentSession = id || null;
  store.set("gw_agent_session", agentSession || "");
  clearLog(id ? "" : "Новая сессия агента: опишите задачу. Инструменты выполняются на сервере.");
  if (!id) return;
  const resp = await fetch(`/agent/sessions/${id}`, { headers: headers() });
  if (!resp.ok) { setStatus(await apiError(resp), true); return; }
  const s = await resp.json();
  const ok = Object.fromEntries((s.tool_runs || []).map(r => [r.call_id, r.ok]));
  for (const m of s.messages) {
    if (m.role === "user") addMessage("user", m.content);
    else if (m.role === "assistant") {
      if (m.content) addMessage("assistant", m.content);
      for (const c of m.tool_calls || []) toolCard(c.id, c.function.name, safeJson(c.function.arguments));
    } else if (m.role === "tool" && cards[m.tool_call_id]) {
      setToolResult(cards[m.tool_call_id], ok[m.tool_call_id] ?? false, m.content);
    }
  }
  if (s.running) setStatus("в сессии идёт запрос (открыт в другой вкладке?)");
  } catch (error) { setStatus('Шлюз недоступен; повторите загрузку', true); }
}

async function sendAgent(text) {
  const model = $("model").value;
  if (!agentSession) {
    if (!model) { setStatus("выберите модель", true); return; }
    controller = new AbortController(); busy(true);
    try {
      const resp = await fetch("/agent/sessions", { method: "POST", headers: headers(), signal: controller.signal, body: JSON.stringify({ model }) });
      if (!resp.ok) throw new Error(await apiError(resp));
      agentSession = (await resp.json()).id;
      store.set("gw_agent_session", agentSession);
    } catch (error) {
      controller = null; busy(false); setStatus('Не удалось создать сессию: ' + error.message, true); return;
    }
  }
  const empty = document.querySelector(".empty"); if (empty) empty.remove();
  addMessage("user", text);
  controller = new AbortController();
  busy(true); setStatus("агент работает…");
  let el = null, answer = "", prompt = 0, completion = 0;
  const started = performance.now();
  const handle = (ev) => {
    switch (ev.type) {
      case "text":
        if (!el) { el = addMessage("assistant", ""); answer = ""; }
        answer += ev.text; el.innerHTML = renderMarkdown(answer); el.scrollIntoView({ block: "end" }); break;
      case "assistant": el = null; break;
      case "tool_call": toolCard(ev.id, ev.name, ev.arguments); break;
      case "permission_request": askPermission(ev); setStatus("ждёт подтверждения"); break;
      case "tool_result":
        setToolResult(cards[ev.id] || toolCard(ev.id, ev.name, ""), ev.ok, ev.content, ev.ms);
        setStatus("агент работает…"); break;
      case "usage": prompt += ev.prompt_tokens; completion += ev.completion_tokens; break;
      case "warning": setStatus(ev.message, true); break;
      case "error": { const e = addMessage("assistant", ""); e.classList.add("error"); e.textContent = ev.message; break; }
      case "done": {
        const meta = document.createElement("div"); meta.className = "meta";
        const secs = ((performance.now() - started) / 1000).toFixed(1);
        const why = { stop: "", max_steps: " · лимит шагов", cancelled: " · отменено", error: " · ошибка", blocked: " · заблокировано", budget: " · бюджет контекста" }[ev.reason] ?? "";
        meta.textContent = `${secs} с · токенов: ${prompt} → ${completion}${why}`;
        $("log").appendChild(meta); meta.scrollIntoView({ block: "end" }); break;
      }
    }
  };
  try {
    const resp = await fetch(`/agent/sessions/${agentSession}/messages`, {
      method: "POST", headers: headers(), signal: controller.signal, body: JSON.stringify({ content: text }) });
    if (!resp.ok) throw new Error(await apiError(resp));
    let finished = false;
    for await (const ev of readSSE(resp)) {
      if (ev.stream_done) continue;
      handle(ev);
      if (ev.type === 'done') { finished = true; break; }
    }
    if (!finished) throw new Error('Поток агента оборвался; история сохранена на сервере');
    setStatus("");
  } catch (e) {
    if (e.name === "AbortError") setStatus("остановлено");
    else { const m = addMessage("assistant", ""); m.classList.add("error"); m.textContent = "Ошибка: " + e.message; setStatus("ошибка", true); }
  } finally {
    controller = null; busy(false); $("input").focus();
    loadSessions();
  }
}

function applyMode() {
  const agent = mode === "agent";
  $("mode").value = mode;
  $("session").hidden = !agent;
  $("params").hidden = agent;
  controller?.abort();
  if (agent) { loadSessions().then(() => openSession(agentSession)); }
  else { history = []; clearLog("Введите токен, выберите модель и задайте вопрос."); }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || controller) return;
  $("input").value = ""; autosize();
  if (mode === "agent") sendAgent(text); else send(text);
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; }
$("input").addEventListener("input", autosize);
$("stop").addEventListener("click", () => {
  if (mode === "agent" && agentSession) fetch(`/agent/sessions/${agentSession}/cancel`, { method: "POST", headers: headers() });
  controller?.abort();
});
$("new").addEventListener("click", () => {
  controller?.abort(); history = [];
  if (mode === "agent") { openSession(null); $("session").value = ""; }
  else $("log").innerHTML = '<div class="empty">Новый чат.</div>';
  $("input").focus();
});
$("mode").addEventListener("change", () => { mode = $("mode").value; store.set("gw_mode", mode); applyMode(); });
$("session").addEventListener("change", () => { controller?.abort(); openSession($("session").value); });
$("token").addEventListener("change", () => {
  if ($('remember').checked) store.set('gw_token', $('token').value.trim());
  loadModels(); if (mode === "agent") loadSessions();
});
$('remember').addEventListener('change', () => {
  store.set('gw_remember', $('remember').checked ? 'yes' : 'no');
  if ($('remember').checked) store.set('gw_token', $('token').value.trim());
  else { try { localStorage.removeItem('gw_token'); } catch {} }
});
$("model").addEventListener("change", () => store.set("gw_model", $("model").value));
$("system").addEventListener("change", () => store.set("gw_system", $("system").value));
$("reload").addEventListener("click", loadModels);
if ($("token").value) loadModels();
if (mode === "agent") applyMode();
</script>
</body>
</html>
