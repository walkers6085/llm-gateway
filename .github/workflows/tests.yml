name: Проверки
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
        bun: ['1.3.8', '1.3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --cwd tui --frozen-lockfile --ignore-scripts
      - run: bun run --cwd tui typecheck
      - run: bun run --cwd tui test
      - run: python -m pip install -r requirements-dev.txt -c requirements.lock
      - run: python -m pytest -q
      - run: node --test tests/test_chat.mjs
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/gateway-wheel .
      - run: python -m pip install --no-deps --force-reinstall /tmp/gateway-wheel/*.whl
      - name: Проверка установленного пакета вне checkout
        working-directory: /tmp
        run: python "$GITHUB_WORKSPACE/tests/smoke_installed.py" --tui
      - run: git diff --exit-code
